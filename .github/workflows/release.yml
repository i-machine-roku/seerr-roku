name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package channel zip
        run: |
          mkdir -p build
          zip -r "build/seerr-roku-${{ github.ref_name }}.zip" \
            manifest components source images \
            -x '*.bak'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/seerr-roku-${{ github.ref_name }}.zip
          generate_release_notes: true
